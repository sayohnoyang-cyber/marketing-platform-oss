# Example production deploy workflow. It does not hard-code a server address.
# Configure GitHub Actions secrets: DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Change the SSH User (currently "root") to a dedicated deploy account if you can.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  integration:
    name: 验证真实 MySQL 与 Redis 链路
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_DATABASE: marketing
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 运行集成测试
        env:
          MARKETING_IT: 'true'
          MYSQL_PASSWORD: ci-test-only
          REDIS_PORT: '6379'
        run: ./mvnw -B -ntp -pl marketing-app -am test '-Dtest=*IT' -Dsurefire.failIfNoSpecifiedTests=false

  deploy:
    needs: integration
    if: github.repository == 'sayohnoyang-cyber/marketing-platform-oss'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEPLOY_DIR: /opt/marketing-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend jar
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp package
          ls -lh marketing-app/target/*.jar

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: console-vue/package-lock.json

      - name: Build frontend
        working-directory: console-vue
        env:
          # 短链展示用规范域名。证书启用前，HTTP 直连 IP 仍然可用。
          VITE_PUBLIC_SHORTLINK_ORIGIN: https://sayohno.cn
        run: |
          npm ci
          npm run test:models
          npm run build

      - name: Assemble release bundle
        run: |
          mkdir -p bundle/db
          jar=$(ls marketing-app/target/marketing-app-*.jar | grep -v '\.original$' | head -1)
          cp "$jar" bundle/app.jar
          cp -r console-vue/dist bundle/dist
          cp marketing-app/src/main/resources/db/V*.sql bundle/db/
          cp deploy/remote-deploy.sh bundle/remote-deploy.sh
          cp deploy/redis-cutover.sh bundle/redis-cutover.sh
          cp -r deploy/nginx bundle/nginx
          echo "${GITHUB_SHA}" > bundle/sha

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG

      - name: Upload bundle
        run: |
          # 先把当前线上 jar 放进上传目录，rsync 只传差异，减少跨境上传量
          ssh deploy-target "mkdir -p $DEPLOY_DIR/releases/incoming && [ -s $DEPLOY_DIR/releases/incoming/app.jar ] || cp $DEPLOY_DIR/app/app.jar $DEPLOY_DIR/releases/incoming/app.jar"
          for i in 1 2 3; do
            rsync -az --partial --delete --timeout=120 bundle/ deploy-target:$DEPLOY_DIR/releases/incoming/ && break
            echo "上传失败，重试 $i"; sleep 10
            [ "$i" = 3 ] && exit 1
          done

      - name: Deploy on server
        run: ssh deploy-target "bash $DEPLOY_DIR/releases/incoming/remote-deploy.sh deploy ${GITHUB_SHA}"

      - name: Health check
        run: |
          host=${{ secrets.DEPLOY_HOST }}
          for i in $(seq 1 12); do
            # 裸 IP 的 HTTP 保持可访问，证书启用前后这步都成立。
            page=$(curl -fsS --max-time 10 "http://$host/" || true)
            api=$(curl -fsS --max-time 10 "http://$host/api/health" || true)
            if echo "$page" | grep -q '<div id="app"' && echo "$api" | grep -q '"UP"'; then
              echo "站点和接口正常"; exit 0
            fi
            sleep 10
          done
          echo "健康检查失败"; exit 1

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
