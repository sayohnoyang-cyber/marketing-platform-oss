services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: marketing
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - marketing-mysql:/var/lib/mysql

  redis:
    image: redis:7.2
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    depends_on:
      - rocketmq-namesrv
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "10909:10909"
      - "10912:10912"
    command: sh -c "echo 'autoCreateTopicEnable=true' > /tmp/broker.conf && echo 'brokerIP1=127.0.0.1' >> /tmp/broker.conf && exec sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf"

volumes:
  marketing-mysql:
